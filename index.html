<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Etch-a-Sketch</h1>
      <p class="subtitle">Hover over the grid to draw.</p>

      <div class="controls">
        <button id="resize" type="button">Resize Grid</button>
        <button id="clear" type="button">Clear</button>
        <button id="rainbow" type="button" aria-pressed="false">Rainbow: Off</button>
      </div>

      <p class="grid-size" id="grid-size" aria-live="polite">Grid: 16 × 16</p>
      <section class="board" id="board" aria-label="Drawing board"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
